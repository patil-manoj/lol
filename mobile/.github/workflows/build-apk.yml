name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: Build Android APK
        run: eas build --platform android --profile production --non-interactive --no-wait
        env:
          EAS_NO_VCS: 1
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}

      - name: Wait for build to complete
        run: |
          echo "Build started! Check your build status at:"
          echo "https://expo.dev/accounts/${{ github.repository_owner }}/projects/talk-to-me-mobile/builds"

      - name: Download APK (if build completes)
        run: |
          # This step would download the APK once build is complete
          # You'll need to manually download from Expo dashboard for now
          echo "Once build completes, download APK from Expo dashboard"
