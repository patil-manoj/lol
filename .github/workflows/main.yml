name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: Build Android APK
        id: build
        run: |
          BUILD_URL=$(eas build --platform android --profile production --non-interactive --json | jq -r '.[0].id')
          echo "build_id=$BUILD_URL" >> $GITHUB_OUTPUT
          echo "Build ID: $BUILD_URL"
        env:
          EAS_NO_VCS: 1
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}

      - name: Wait for build to complete
        run: |
          echo "Waiting for build to complete..."
          eas build:view ${{ steps.build.outputs.build_id }} --json

          # Wait up to 30 minutes for build
          for i in {1..60}; do
            STATUS=$(eas build:view ${{ steps.build.outputs.build_id }} --json | jq -r '.status')
            echo "Build status: $STATUS"
            
            if [ "$STATUS" = "finished" ]; then
              echo "Build completed successfully!"
              break
            elif [ "$STATUS" = "errored" ] || [ "$STATUS" = "canceled" ]; then
              echo "Build failed with status: $STATUS"
              exit 1
            fi
            
            echo "Waiting... ($i/60)"
            sleep 30
          done
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download APK
        run: |
          APK_URL=$(eas build:view ${{ steps.build.outputs.build_id }} --json | jq -r '.artifacts.buildUrl')
          echo "Downloading APK from: $APK_URL"
          curl -L -o talk-to-me.apk "$APK_URL"
          ls -lh talk-to-me.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Talk to Me v${{ steps.version.outputs.version }}
          body: |
            ## 📱 Talk to Me - Voice AI Companion

            ### What's New
            - Latest build from Expo
            - Bug fixes and improvements

            ### Installation
            1. Download `talk-to-me.apk` below
            2. Enable "Install from unknown sources" on your Android device
            3. Install the APK
            4. Grant microphone permissions when prompted

            ### Requirements
            - Android 5.0 (Lollipop) or higher
            - Internet connection
            - Microphone access

            **Backend URL:** ${{ secrets.EXPO_PUBLIC_API_URL }}
          files: mobile/talk-to-me.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
